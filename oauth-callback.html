<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whoop Weekly Coach – Autorisierung</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    max-width: 480px;
    text-align: center;
  }
  code {
    background: #1e2128;
    padding: 2px 6px;
    border-radius: 4px;
    word-break: break-all;
  }
  #fallback {
    display: none;
    margin-top: 24px;
    font-size: 14px;
    opacity: 0.85;
  }
</style>
</head>
<body>
<div class="card">
  <p id="status">Autorisierung wird abgeschlossen, bitte warten …</p>
  <div id="fallback">
    <p>Die automatische Weiterleitung an dein lokales Backend hat nicht funktioniert
       (läuft es gerade nicht, oder bist du nicht auf demselben Rechner/Netz)?</p>
    <p>Kopiere stattdessen diesen Code und schließe die Anmeldung manuell im Backend ab:</p>
    <p><code id="code"></code></p>
  </div>
</div>
<script>
(function () {
  var search = window.location.search;
  var params = new URLSearchParams(search);
  var error = params.get("error");
  var code = params.get("code");
  var statusEl = document.getElementById("status");
  var fallbackEl = document.getElementById("fallback");

  if (error) {
    statusEl.textContent = "Autorisierung abgelehnt oder fehlgeschlagen: " + error;
    return;
  }
  if (!code) {
    statusEl.textContent = "Kein Autorisierungscode in der URL gefunden.";
    return;
  }

  document.getElementById("code").textContent = code;
  fallbackEl.style.display = "block";

  // Full top-level navigation to the local backend (same machine/network only).
  // This is not blocked by mixed-content rules since it's a real navigation, not a fetch/XHR.
  window.location.replace("http://localhost:8000/oauth/callback" + search);
})();
</script>
</body>
</html>
